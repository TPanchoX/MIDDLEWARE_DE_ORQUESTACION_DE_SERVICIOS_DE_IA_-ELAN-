services:
  middleware:
    build:
      context: .
    image: elan-ai-middleware:0.1.0
    container_name: elan-ai-middleware
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MIDDLEWARE_HOST: 0.0.0.0
      MIDDLEWARE_PORT: 8000
      MIDDLEWARE_LOG_LEVEL: INFO
      MIDDLEWARE_RUNTIME_PROFILE: final
      MIDDLEWARE_MODELS_STORE_DIR: /app/data/models_store
      # Bootstrap: en cada arranque el middleware escanea este directorio y
      # re-registra automáticamente cualquier manifest.json que encuentre.
      # Combinado con el bind mount de abajo, los manifests de los modelos
      # instalados sobreviven incluso a un reseteo completo de volúmenes.
      MIDDLEWARE_BOOTSTRAP_MANIFESTS_DIR: /app/data/bootstrap_manifests
      # Carpeta del HOST donde están los videos.
      # Se monta en solo lectura como /data/videos dentro de cada contenedor
      # de modelo. Usar barras "/" incluso en Windows (Docker Desktop las traduce).
      MIDDLEWARE_VIDEOS_DIR: "C:/Users/imbaq/OneDrive/Desktop"
      # Red Docker compartida para la comunicación contenedor a contenedor.
      # Los contenedores de modelo se unen a esta red para que el middleware
      # los alcance por nombre de contenedor (sin mapear puertos al host).
      MIDDLEWARE_DOCKER_NETWORK: elan-ai-shared
    volumes:
      # BIND MOUNTS — viven en el filesystem del host y NUNCA los borra
      # "docker-compose down -v", "docker volume prune" ni Docker Desktop.
      # El registry (registry.json) y los modelos instalados persisten aquí.
      - ./data/models_store:/app/data/models_store
      # Manifests de respaldo: se copian aquí al instalar cada modelo para que
      # el middleware pueda re-registrarlos automáticamente en el próximo
      # arranque, incluso si el registry principal se pierde.
      - ./data/bootstrap_manifests:/app/data/bootstrap_manifests
      # Socket de Docker: permite al middleware construir/ejecutar los
      # contenedores de modelo desde dentro de su propio contenedor.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - shared
    restart: unless-stopped

# Sin volúmenes nombrados — todo vive en el host vía bind mounts.

networks:
  shared:
    # Nombre fijo para que los contenedores de modelo puedan unirse con este
    # nombre exacto, sin importar el prefijo de proyecto de docker-compose.
    name: elan-ai-shared
